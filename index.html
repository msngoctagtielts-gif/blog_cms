    <style>
        :root {
            --xanh-duong-dam: #0A2540;      /* Xanh dương đậm chủ đạo */
            --xanh-duong-sang: #1A4A7A;     /* Xanh dương sáng hơn cho gradient */
            --vang-anh-kim: #D4AF37;        /* Vàng ánh kim sang trọng */
            --do-do: #8A1C2C;               /* Đỏ đô quý phái (anh đào / burgundy) */
            --do-do-nhat: #9E3A47;           /* Đỏ đô nhẹ cho hiệu ứng */
            --bg-body: #F8FAFE;              /* Nền trắng tinh tế, hơi lạnh chuyên nghiệp */
            --bg-card: #FFFFFF;
            --text-main: #1F2A3E;
            --text-muted: #5A6B7F;
            --border-color: #E9EEF4;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --shadow-sm: 0 12px 28px rgba(10, 37, 64, 0.06);
            --shadow-hover: 0 25px 40px rgba(10, 37, 64, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== HEADER CAO CẤP ========== */
        .modern-header {
            position: relative;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FBFE 100%);
            padding: 80px 20px 70px;
            text-align: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(10, 37, 64, 0.08);
            margin-bottom: 40px;
            cursor: pointer;
        }

        .modern-header::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(10, 37, 64, 0.02) 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .modern-header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(138, 28, 44, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            z-index: 2;
        }

        .avatar-pulse {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--xanh-duong-dam), var(--vang-anh-kim));
            animation: pulse-ring 2.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 12px 24px rgba(10, 37, 64, 0.2);
            position: relative;
            z-index: 2;
        }

        .anim-icon {
            position: absolute;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            z-index: 3;
            animation: float-icon 3s ease-in-out infinite;
            backdrop-filter: blur(2px);
        }

        .icon-left { top: 10%; left: -25px; animation-delay: 0s; }
        .icon-right { bottom: 15%; right: -25px; animation-delay: 1s; }
        .icon-top { top: -20px; right: 10px; animation-delay: 2s; font-size: 20px; }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(4deg); }
        }

        .gradient-text {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            background: linear-gradient(125deg, var(--xanh-duong-dam) 0%, var(--xanh-duong-sang) 60%, var(--vang-anh-kim) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 500;
            max-width: 620px;
            margin: 0 auto 20px;
        }

        .header-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }

        .badge.premium {
            background: rgba(138, 28, 44, 0.12);
            color: var(--do-do);
            border: 1px solid rgba(138, 28, 44, 0.25);
        }

        .badge.update {
            background: rgba(212, 175, 55, 0.12);
            color: #A77C1A;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* container */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* Thanh tìm kiếm & lọc */
        .filter-bar {
            display: flex;
            gap: 18px;
            margin-bottom: 48px;
            flex-wrap: wrap;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 18px 24px;
            border-radius: 32px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 20px;
            z-index: 20;
        }

        .search-input, .category-select {
            padding: 14px 24px;
            border: 1.5px solid transparent;
            border-radius: 40px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s;
            background: #FFFFFF;
            color: var(--text-main);
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .search-input {
            flex: 1;
            min-width: 260px;
            border-color: #E2E8F0;
        }

        .category-select {
            min-width: 210px;
            cursor: pointer;
            border-color: #E2E8F0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%231A4A7A" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 20px center;
            appearance: none;
        }

        .search-input:focus, .category-select:focus {
            border-color: var(--vang-anh-kim);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.25);
        }

        /* Grid cards */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 36px;
        }

        .post-card {
            background: var(--bg-card);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(10, 37, 64, 0.05);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            transition: all 0.35s ease;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .thumb-wrap {
            width: 100%;
            height: 230px;
            overflow: hidden;
            position: relative;
            background-color: #F1F5F9;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .post-card:hover .thumb-wrap img {
            transform: scale(1.05);
        }

        .badge-category {
            position: absolute;
            top: 18px;
            left: 18px;
            background: var(--do-do);
            color: #FFECB3;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(2px);
            border: 0.5px solid rgba(212, 175, 55, 0.4);
            text-transform: uppercase;
        }

        .card-body {
            padding: 26px 24px 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        .card-title {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 14px;
            transition: color 0.25s;
        }

        .post-card:hover .card-title {
            color: var(--xanh-duong-dam);
        }

        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.55;
        }

        .btn-learn {
            margin-top: auto;
            background: #F0F4F9;
            color: var(--xanh-duong-dam);
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            font-size: 0.9rem;
            border: 1px solid rgba(10, 37, 64, 0.05);
        }

        .btn-learn span {
            transition: transform 0.25s ease;
            background: white;
            padding: 5px 10px;
            border-radius: 30px;
            font-size: 0.85rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .post-card:hover .btn-learn {
            background: var(--vang-anh-kim);
            color: #0A2540;
            border-color: transparent;
        }

        .post-card:hover .btn-learn span {
            transform: translateX(6px);
            background: #0A2540;
            color: var(--vang-anh-kim);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 56px;
        }

        .page-btn {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Inter', sans-serif;
            box-shadow: var(--shadow-sm);
        }

        .page-btn:hover:not(:disabled) {
            background: var(--vang-anh-kim);
            color: var(--xanh-duong-dam);
            border-color: var(--vang-anh-kim);
            transform: translateY(-2px);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            font-weight: 600;
            color: var(--text-muted);
            background: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        /* ========== TRANG CHI TIẾT ========== */
        .article-view {
            max-width: 880px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 48px 56px;
            border-radius: 36px;
            box-shadow: var(--shadow-hover);
            animation: fadeInUp 0.5s ease;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
            background: #F1F4F9;
            color: var(--xanh-duong-dam);
            padding: 10px 24px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .btn-back:hover {
            background: var(--vang-anh-kim);
            transform: translateX(-5px);
            color: #0A2540;
        }

        .art-title {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
            font-weight: 800;
            color: var(--xanh-duong-dam);
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .art-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 36px;
            padding-bottom: 20px;
            border-bottom: 1.5px solid rgba(212, 175, 55, 0.25);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .art-tag {
            background: rgba(138, 28, 44, 0.1);
            color: var(--do-do);
            padding: 5px 16px;
            border-radius: 32px;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .art-hero {
            width: 100%;
            max-height: 480px;
            object-fit: cover;
            border-radius: 28px;
            margin-bottom: 40px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        /* Nội dung bài viết Markdown */
        .art-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #264653;
        }

        .art-content h1, .art-content h2, .art-content h3 {
            color: var(--xanh-duong-dam);
            margin-top: 1.8em;
            margin-bottom: 0.5em;
            font-weight: 700;
        }

        .art-content h2 {
            border-left: 5px solid var(--vang-anh-kim);
            padding-left: 18px;
        }

        .art-content p {
            margin-bottom: 1.3em;
        }

        .art-content a {
            color: var(--do-do);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid rgba(138, 28, 44, 0.3);
            transition: 0.2s;
        }

        .art-content a:hover {
            color: var(--vang-anh-kim);
            border-bottom-color: var(--vang-anh-kim);
        }

        .art-content img {
            max-width: 100%;
            border-radius: 20px;
            margin: 1.5em 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .art-content blockquote {
            border-left: 5px solid var(--vang-anh-kim);
            background: #FFFBF0;
            padding: 18px 24px;
            margin: 1.8em 0;
            border-radius: 20px;
            font-style: normal;
            font-weight: 500;
            color: #5A4A1A;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .art-content code {
            font-family: 'Be Vietnam Pro', monospace;
            background: #FEF3E8;
            color: var(--do-do);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .art-content ul, .art-content ol {
            margin-bottom: 1.2em;
            padding-left: 28px;
        }

        .art-content li {
            margin-bottom: 0.5em;
        }

        /* loader */
        .loader {
            text-align: center;
            padding: 60px;
            font-weight: 500;
            color: var(--xanh-duong-dam);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E2E8F0;
            border-top-color: var(--vang-anh-kim);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .modern-header { padding: 50px 20px 40px; }
            .filter-bar { flex-direction: column; top: 0; border-radius: 28px; padding: 16px; }
            .article-view { padding: 28px 20px; border-radius: 28px; }
            .post-grid { gap: 24px; }
        }
    </style>

<body>

    <header class="modern-header" onclick="window.location.href=window.location.pathname" style="cursor: pointer;">
        <div class="avatar-container">
            <div class="avatar-pulse"></div>
            <img src="https://scontent.fdad3-4.fna.fbcdn.net/v/t39.30808-6/358558533_3535771650036770_678695724279764578_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=1d70fc&_nc_ohc=oi4PBqSXTi8Q7kNvwFuh_f7&_nc_oc=AdrTDolnQq2gnFLELr5nJRg2pJzwepV4vtaMSrdRmPSfKoWcVhMQFgziXZB6EWP86o6DA6gNLclnTj3Si481-73D&_nc_zt=23&_nc_ht=scontent.fdad3-4.fna&_nc_gid=KcHwbCJZeyVIa7kBtY4vMA&_nc_ss=7b2a8&oh=00_Af6xnoODDsHKb5JgxY7-McsMFFMvDOVXiGKxlzgr_MvIXw&oe=69FF8352" alt="Ms Ngoc Academy" class="avatar-img">
            <div class="anim-icon icon-left">✨</div>
            <div class="anim-icon icon-right">📘</div>
            <div class="anim-icon icon-top">🎓</div>
        </div>
        <h1 class="gradient-text">Ms Ngoc Academy</h1>
        <p class="tagline">Tinh hoa tri thức Anh ngữ — Phong cách doanh nhân & học giả</p>
        <div class="header-badges">
            <span class="badge premium">✦ 100% Premium miễn phí</span>
            <span class="badge update">⚡ Cập nhật liên tục</span>
        </div>
    </header>

    <div class="container">
        <div id="filter-container" class="filter-bar" style="display: none;">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm bài học chuyên sâu..." oninput="filterPosts()">
            <select id="categorySelect" class="category-select" onchange="filterPosts()">
                <option value="all">📚 Tất cả chuyên đề</option>
            </select>
        </div>

        <div id="app-container">
            <div class="loader">
                <div class="spinner"></div>
                Đang tải kho tàng bài giảng...
            </div>
        </div>
        <div id="pagination-container" class="pagination" style="display: none;"></div>
    </div>

    <script>
        // API URL bảng dữ liệu (giữ nguyên kết nối)
        const API_URL = "https://script.google.com/macros/s/AKfycbwkq6smshRwrNCXzAkW-4kZBJ7qe8wdoLRXUltoPSR4w7tssZXKxTUnK_WWdxDtVZAshQ/exec";
        
        marked.setOptions({ breaks: true, gfm: true });
        
        let allPosts = [];
        let filteredPosts = [];
        const POSTS_PER_PAGE = 6;
        let currentPage = 1;
        
        function formatDate(dateString) {
            if (!dateString) return 'Mới đăng';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }
        
        async function initApp() {
            try {
                const response = await fetch(API_URL + "?timestamp=" + new Date().getTime());
                const json = await response.json();
                if (!json.data || json.data.length === 0) {
                    document.getElementById('app-container').innerHTML = '<div style="text-align:center; padding: 60px; background:white; border-radius:32px;">📭 Chưa có bài học nào. Quay lại sau nhé!</div>';
                    return;
                }
                allPosts = json.data.map((post, idx) => { post.originalId = idx; return post; });
                filteredPosts = [...allPosts];
                
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('id');
                if (postId !== null && allPosts[postId]) {
                    document.querySelector('.filter-bar').style.display = 'none';
                    renderDetail(allPosts[postId]);
                } else {
                    document.getElementById('filter-container').style.display = 'flex';
                    setupCategories();
                    renderGrid();
                }
            } catch (error) {
                document.getElementById('app-container').innerHTML = '<div style="text-align:center; padding: 50px; color:#8A1C2C;">⚠️ Lỗi kết nối máy chủ. Vui lòng thử lại sau.</div>';
            }
        }
        
        function setupCategories() {
            const selectBox = document.getElementById('categorySelect');
            let categories = new Set();
            allPosts.forEach(post => {
                if(post.Category && post.Category.trim() !== '') categories.add(post.Category.trim());
            });
            categories.forEach(cat => { selectBox.innerHTML += `<option value="${cat}">📌 ${cat}</option>`; });
        }
        
        function filterPosts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedCat = document.getElementById('categorySelect').value;
            filteredPosts = allPosts.filter(post => {
                const titleMatch = (post.Title || '').toLowerCase().includes(keyword);
                const descMatch = (post.Description || '').toLowerCase().includes(keyword);
                const isMatchKeyword = titleMatch || descMatch;
                const isMatchCategory = (selectedCat === 'all') || (post.Category === selectedCat);
                return isMatchKeyword && isMatchCategory;
            });
            currentPage = 1;
            renderGrid();
        }
        
        function renderGrid() {
            const container = document.getElementById('app-container');
            const paginationContainer = document.getElementById('pagination-container');
            if(filteredPosts.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 60px; background:#FFFFFF; border-radius:32px; border:1px solid #E9EEF4;">🔍 Không tìm thấy nội dung phù hợp. Thử từ khóa khác.</div>';
                paginationContainer.style.display = 'none';
                return;
            }
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            const startIndex = (currentPage - 1) * POSTS_PER_PAGE;
            const postsToShow = filteredPosts.slice(startIndex, startIndex + POSTS_PER_PAGE);
            let gridHTML = '<div class="post-grid">';
            postsToShow.forEach((post, idx) => {
                let imgSrc = post.ImageURL ? post.ImageURL : 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=1000&auto=format';
                let excerpt = post.Description ? post.Description : (post.Content || '').substring(0, 110) + '…';
                let displayDate = formatDate(post.Date);
                gridHTML += `
                    <a href="?id=${post.originalId}" class="post-card" style="animation-delay: ${idx * 0.08}s">
                        <div class="thumb-wrap">
                            <span class="badge-category">${post.Category || 'CHUYÊN ĐỀ'}</span>
                            <img src="${imgSrc}" loading="lazy" alt="lesson thumbnail">
                        </div>
                        <div class="card-body">
                            <span class="card-date">📅 ${displayDate}</span>
                            <h2 class="card-title">${post.Title || 'Học thuật chuyên sâu'}</h2>
                            <p class="card-desc">${excerpt}</p>
                            <div class="btn-learn">
                                Khám phá ngay <span>→</span>
                            </div>
                        </div>
                    </a>
                `;
            });
            gridHTML += '</div>';
            container.innerHTML = gridHTML;
            if(totalPages > 1) {
                paginationContainer.style.display = 'flex';
                paginationContainer.innerHTML = `
                    <button class="page-btn" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>← Trước</button>
                    <div class="page-info">${currentPage} / ${totalPages}</div>
                    <button class="page-btn" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Sau →</button>
                `;
            } else {
                paginationContainer.style.display = 'none';
            }
        }
        
        function changePage(direction) {
            currentPage += direction;
            renderGrid();
            document.getElementById('app-container').scrollIntoView({ behavior: 'smooth' });
        }
        
        function renderDetail(post) {
            const container = document.getElementById('app-container');
            const heroImg = post.ImageURL ? `<img src="${post.ImageURL}" class="art-hero" alt="featured">` : '';
            const catTag = post.Category ? `<span class="art-tag">${post.Category}</span>` : '';
            const parsedHTMLContent = marked.parse(post.Content || 'Nội dung đang được cập nhật...');
            const displayDate = formatDate(post.Date);
            container.innerHTML = `
                <div class="article-view">
                    <a href="${window.location.pathname}" class="btn-back">← Quay lại thư viện</a>
                    <h1 class="art-title">${post.Title || 'Tinh hoa Anh ngữ'}</h1>
                    <div class="art-meta">
                        <span>📆 Cập nhật: ${displayDate}</span>
                        ${catTag}
                        <span style="margin-left:auto;">✨ Ms Ngoc Academy</span>
                    </div>
                    ${heroImg}
                    <div class="art-content">${parsedHTMLContent}</div>
                    <div class="comments-section" style="margin-top: 48px; padding-top: 32px; border-top: 2px dashed rgba(212,175,55,0.3);">
                        <div class="comments-title" style="font-size: 1.4rem; font-weight:700; display:flex; gap:12px; align-items:center;">
                            💬 Góc thảo luận <span style="font-size: 0.8rem; background:#F1F5F9; padding:4px 12px; border-radius:40px;">Cộng đồng học giả</span>
                        </div>
                        <div class="fb-comments" data-href="${window.location.href}" data-width="100%" data-numposts="5" data-colorscheme="light"></div>
                    </div>
                </div>
            `;
            if (typeof FB !== 'undefined') {
                FB.XFBML.parse(container);
            }
        }
        
        initApp();
    </script>
</body>
</html>
